<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#ffffff">
<title>内容后台 · Mr.wolf</title>
<style>
:root{
  --bg:#f4f6f9; --surface:#fff; --surface-2:#f8fafc; --border:#e4e9f0;
  --text:#16202c; --muted:#6b7c93; --faint:#9aa8b8;
  --accent:#2472b3; --accent-hover:#1d5f96; --accent-soft:rgba(36,114,179,.1);
  --danger:#c0392b; --danger-soft:rgba(192,57,43,.08);
  --ok:#2f7d4f;
  --radius:12px; --radius-sm:9px;
  --shadow:0 1px 2px rgba(16,24,40,.04), 0 8px 24px -8px rgba(16,24,40,.12);
  --shadow-lg:0 24px 60px -12px rgba(16,24,40,.25);
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0f1319; --surface:#171d26; --surface-2:#1d242e; --border:#28313d;
    --text:#e7edf5; --muted:#93a1b3; --faint:#6b7a8d;
    --accent:#5aa9e6; --accent-hover:#79bbee; --accent-soft:rgba(90,169,230,.14);
    --danger:#ef7b72; --danger-soft:rgba(239,123,114,.12);
    --ok:#74dfae;
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 24px -8px rgba(0,0,0,.5);
    --shadow-lg:0 24px 60px -12px rgba(0,0,0,.6);
  }
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);
  font:14.5px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  -webkit-font-smoothing:antialiased}
svg{display:block}
.ico{width:16px;height:16px;stroke:currentColor;stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round;flex:0 0 auto}
.ico-lg{width:20px;height:20px}

/* ---------- 通用控件 ---------- */
.btn{display:inline-flex;align-items:center;gap:7px;height:36px;padding:0 14px;border-radius:var(--radius-sm);
  border:1px solid var(--border);background:var(--surface);color:var(--text);font:inherit;font-size:13.5px;
  cursor:pointer;transition:background .15s,border-color .15s,transform .1s;white-space:nowrap}
.btn:hover{background:var(--surface-2);border-color:var(--faint)}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{background:var(--accent-hover);border-color:var(--accent-hover)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--muted)}
.btn.ghost:hover{background:var(--surface-2);color:var(--text)}
.btn.danger{color:var(--danger);border-color:transparent;background:transparent}
.btn.danger:hover{background:var(--danger-soft)}
.btn.icon{width:36px;padding:0;justify-content:center}
.btn.sm{height:30px;padding:0 10px;font-size:12.5px}
.btn.sm.icon{width:30px}
input,textarea,select{font:inherit;width:100%;padding:9px 12px;border:1px solid var(--border);border-radius:var(--radius-sm);
  background:var(--surface);color:var(--text);transition:border-color .15s,box-shadow .15s}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
textarea{resize:vertical;min-height:64px}
label{display:block;font-size:12.5px;font-weight:500;color:var(--muted);margin:16px 0 6px}
label:first-child{margin-top:0}
.hint{font-size:12px;color:var(--faint);margin-top:6px}

/* ---------- 登录 ---------- */
#login{min-height:100%;display:flex;align-items:center;justify-content:center;padding:24px;
  background:
    radial-gradient(1100px 480px at 50% -10%, var(--accent-soft), transparent 65%),
    var(--bg)}
.login-card{width:100%;max-width:368px;background:var(--surface);border:1px solid var(--border);
  border-radius:18px;padding:30px 28px 26px;box-shadow:var(--shadow-lg)}
.login-mark{width:44px;height:44px;border-radius:13px;background:var(--accent);color:#fff;
  display:flex;align-items:center;justify-content:center;margin-bottom:16px;box-shadow:0 8px 20px -6px var(--accent)}
.login-card h1{margin:0 0 6px;font-size:19px;letter-spacing:.01em}
.login-card p.sub{margin:0 0 22px;color:var(--muted);font-size:13px}
.err{color:var(--danger);font-size:12.5px;min-height:18px;margin:10px 0 0}

/* ---------- 布局 ---------- */
#app{display:none;min-height:100%;flex-direction:column}
#app.on{display:flex}
header{position:sticky;top:0;z-index:30;background:color-mix(in srgb,var(--surface) 82%,transparent);
  backdrop-filter:saturate(180%) blur(12px);border-bottom:1px solid var(--border)}
.bar{max-width:1000px;margin:0 auto;padding:0 20px;height:58px;display:flex;align-items:center;gap:12px}
.brand{display:flex;align-items:center;gap:10px;font-weight:600;font-size:15px;min-width:0}
.brand .dot{width:26px;height:26px;border-radius:8px;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.brand span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar .right{margin-left:auto;display:flex;align-items:center;gap:8px}
main{flex:1;width:100%;max-width:1000px;margin:0 auto;padding:22px 20px 80px}

.toolbar{display:flex;align-items:center;gap:12px;margin-bottom:18px;flex-wrap:wrap}
.seg{display:inline-flex;background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:3px;gap:2px}
.seg button{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 13px;border:0;border-radius:8px;
  background:transparent;color:var(--muted);font:inherit;font-size:13.5px;cursor:pointer;transition:.15s;white-space:nowrap}
.seg button:hover{color:var(--text)}
.seg button.on{background:var(--accent);color:#fff;box-shadow:0 2px 8px -2px var(--accent)}
.count{font-size:12px;color:var(--faint);margin-left:auto;white-space:nowrap}

/* ---------- 列表 ---------- */
.list{display:flex;flex-direction:column;gap:10px}
.card{display:flex;align-items:center;gap:14px;background:var(--surface);border:1px solid var(--border);
  border-radius:var(--radius);padding:12px 14px;transition:border-color .15s,box-shadow .15s,transform .15s}
.card:hover{border-color:color-mix(in srgb,var(--accent) 40%,var(--border));box-shadow:var(--shadow);transform:translateY(-1px)}
.thumb{width:60px;height:60px;border-radius:10px;flex:0 0 auto;overflow:hidden;background:var(--surface-2);
  display:flex;align-items:center;justify-content:center;font-size:26px;border:1px solid var(--border)}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.meta{flex:1;min-width:0}
.meta .t{font-weight:600;font-size:14.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-bottom:3px}
.meta .d{font-size:12.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chips{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;padding:2px 8px;border-radius:999px;
  background:var(--surface-2);color:var(--muted);border:1px solid var(--border)}
.chip.cat{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.acts{display:flex;gap:4px;flex:0 0 auto}
@media (hover:hover){ .acts{opacity:0;transition:opacity .15s} .card:hover .acts{opacity:1} }

.empty{display:flex;flex-direction:column;align-items:center;gap:10px;padding:60px 20px;color:var(--faint);
  background:var(--surface);border:1px dashed var(--border);border-radius:var(--radius);text-align:center}
.empty .ico{width:30px;height:30px;stroke-width:1.5}
.empty p{margin:0;font-size:13.5px}

/* ---------- 抽屉表单 ---------- */
#scrim{position:fixed;inset:0;background:rgba(10,15,22,.45);opacity:0;pointer-events:none;transition:opacity .25s;z-index:40}
#scrim.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(460px,100%);background:var(--surface);z-index:50;
  box-shadow:var(--shadow-lg);transform:translateX(102%);transition:transform .3s cubic-bezier(.32,.72,0,1);
  display:flex;flex-direction:column}
.drawer.on{transform:none}
.drawer-head{display:flex;align-items:center;gap:10px;padding:16px 20px;border-bottom:1px solid var(--border);flex:0 0 auto}
.drawer-head b{font-size:15px}
.drawer-body{flex:1;overflow-y:auto;padding:20px}
.drawer-foot{padding:14px 20px;border-top:1px solid var(--border);display:flex;gap:10px;flex:0 0 auto;background:var(--surface)}
.drawer-foot .btn.primary{flex:1;justify-content:center}
.drop{border:1.5px dashed var(--border);border-radius:var(--radius-sm);padding:22px 16px;text-align:center;
  color:var(--muted);font-size:12.5px;cursor:pointer;transition:.15s;background:var(--surface-2)}
.drop:hover,.drop.over{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.preview{width:100%;max-height:230px;object-fit:contain;border-radius:var(--radius-sm);border:1px solid var(--border);margin-top:10px;background:var(--surface-2)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:520px){ .row2{grid-template-columns:1fr} }

/* ---------- 评论 ---------- */
#commentPane{display:none}
#commentPane.on{display:block}
.frame-wrap{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden}
#commentFrame{width:100%;height:78vh;border:0;display:block;background:var(--surface)}

/* ---------- toast ---------- */
#toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,14px);background:var(--text);color:var(--bg);
  padding:10px 18px;border-radius:10px;font-size:13px;opacity:0;pointer-events:none;transition:.25s;z-index:99;
  box-shadow:var(--shadow-lg);max-width:88vw;text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0)}

@media (max-width:560px){
  .bar{padding:0 14px;height:54px}
  main{padding:16px 14px 70px}
  .seg{width:100%;overflow-x:auto}
  .count{display:none}
  .thumb{width:52px;height:52px;font-size:22px}
  #commentFrame{height:72vh}
}
</style>
</head>
<body>

<!-- ================= 登录 ================= -->
<div id="login">
  <div class="login-card">
    <div class="login-mark">
      <svg class="ico ico-lg" viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
    </div>
    <h1>内容后台</h1>
    <p class="sub">管理拾光集、灵感集，以及站点评论</p>
    <label for="pw">密码</label>
    <input id="pw" type="password" autocomplete="current-password" placeholder="请输入管理密码">
    <button class="btn primary" id="doLogin" style="width:100%;justify-content:center;margin-top:18px;height:40px">
      <svg class="ico" viewBox="0 0 24 24"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><path d="m10 17 5-5-5-5"/><path d="M15 12H3"/></svg>
      登录
    </button>
    <p class="err" id="loginErr"></p>
  </div>
</div>

<!-- ================= 主界面 ================= -->
<div id="app">
  <header>
    <div class="bar">
      <div class="brand">
        <span class="dot"><svg class="ico" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h10"/></svg></span>
        <span>Mr.wolf 内容后台</span>
      </div>
      <div class="right">
        <a class="btn ghost sm" href="https://worldpeace.top/" target="_blank" rel="noopener">
          <svg class="ico" viewBox="0 0 24 24"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><path d="M15 3h6v6"/><path d="M10 14 21 3"/></svg>
          查看站点
        </a>
        <button class="btn ghost sm" id="logout">
          <svg class="ico" viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="m16 17 5-5-5-5"/><path d="M21 12H9"/></svg>
          退出
        </button>
      </div>
    </div>
  </header>

  <main>
    <div class="toolbar">
      <div class="seg">
        <button data-tab="photos" class="on">
          <svg class="ico" viewBox="0 0 24 24"><path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3Z"/><circle cx="12" cy="13" r="3"/></svg>
          拾光集
        </button>
        <button data-tab="shares">
          <svg class="ico" viewBox="0 0 24 24"><path d="m12 3 1.9 5.1L19 10l-5.1 1.9L12 17l-1.9-5.1L5 10l5.1-1.9Z"/></svg>
          灵感集
        </button>
        <button data-view="comment" id="commentTab">
          <svg class="ico" viewBox="0 0 24 24"><path d="M7.9 20A9 9 0 1 0 4 16.1L2 22Z"/></svg>
          评论
        </button>
      </div>
      <button class="btn primary" id="addBtn" style="margin-left:auto">
        <svg class="ico" viewBox="0 0 24 24"><path d="M5 12h14"/><path d="M12 5v14"/></svg>
        新增
      </button>
      <span class="count" id="count"></span>
    </div>

    <div class="list" id="list"></div>

    <div class="empty" id="empty">
      <svg class="ico" viewBox="0 0 24 24"><path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3Z"/><circle cx="12" cy="13" r="3"/></svg>
      <p>还没有内容，点右上角「新增」开始添加</p>
    </div>

    <div id="commentPane">
      <div class="frame-wrap"><iframe id="commentFrame" title="评论管理"></iframe></div>
      <p class="hint">评论后台来自 Waline，登录状态已同步，无需再次输入密码。</p>
    </div>
  </main>
</div>

<!-- ================= 表单抽屉 ================= -->
<div id="scrim"></div>
<aside class="drawer" id="editor">
  <div class="drawer-head">
    <b id="editorTitle">新增</b>
    <button class="btn ghost icon" id="cancelBtn" style="margin-left:auto" aria-label="关闭">
      <svg class="ico" viewBox="0 0 24 24"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
    </button>
  </div>
  <div class="drawer-body">
    <div id="fieldsPhotos" style="display:none">
      <label for="p_title">标题 <span style="color:var(--danger)">*</span></label>
      <input id="p_title" maxlength="80" placeholder="旅途风景">
      <label for="p_desc">描述</label>
      <textarea id="p_desc" rows="2" maxlength="200" placeholder="那些走过的路，见过的山与海"></textarea>
      <div class="row2">
        <div>
          <label for="p_date">日期</label>
          <input id="p_date" type="date">
        </div>
        <div>
          <label for="p_icon">图标（无图片时显示）</label>
          <input id="p_icon" maxlength="4" placeholder="🌅">
        </div>
      </div>
      <label>图片</label>
      <div class="drop" id="drop">点击选择，或把图片拖到这里<br>jpg / png / webp / gif / avif，单张 ≤ 8MB</div>
      <input id="p_file" type="file" accept="image/*" style="display:none">
      <img id="p_preview" class="preview" style="display:none" alt="">
    </div>

    <div id="fieldsShares" style="display:none">
      <label for="s_title">标题 <span style="color:var(--danger)">*</span></label>
      <input id="s_title" maxlength="120" placeholder="情绪色彩在界面中的应用">
      <div class="row2">
        <div>
          <label for="s_category">分类</label>
          <input id="s_category" maxlength="20" placeholder="设计" list="catList">
          <datalist id="catList"></datalist>
        </div>
        <div>
          <label for="s_date">日期</label>
          <input id="s_date" type="date">
        </div>
      </div>
      <label for="s_desc">描述</label>
      <textarea id="s_desc" rows="3" maxlength="300" placeholder="来自 UJungle 的深度案例……"></textarea>
      <label for="s_url">链接</label>
      <input id="s_url" maxlength="800" placeholder="https://...">
      <p class="hint">留空则该条目不显示「阅读全文」。</p>
    </div>
  </div>
  <div class="drawer-foot">
    <button class="btn" id="cancelBtn2">取消</button>
    <button class="btn primary" id="saveBtn">保存</button>
  </div>
</aside>

<div id="toast"></div>

<script>
(function(){
  var $ = function(s){ return document.querySelector(s) };
  var token = localStorage.getItem('cs_token') || '';
  var tab = 'photos';
  var items = [];
  var editing = null;
  var uploading = false;

  function toast(msg, ms){
    var t = $('#toast'); t.textContent = msg; t.classList.add('on');
    clearTimeout(t._t); t._t = setTimeout(function(){ t.classList.remove('on') }, ms || 2200);
  }
  function api(pathname, opts){
    opts = opts || {};
    opts.headers = Object.assign({ 'Content-Type': 'application/json' }, opts.headers || {});
    if (token) opts.headers.Authorization = 'Bearer ' + token;
    return fetch(pathname, opts).then(function(r){
      return r.json().catch(function(){ return {} }).then(function(j){
        if (!r.ok) throw new Error(j.error || ('请求失败 ' + r.status));
        return j;
      });
    });
  }
  function showLogin(){ $('#login').style.display = 'flex'; $('#app').classList.remove('on') }
  function showApp(){ $('#login').style.display = 'none'; $('#app').classList.add('on'); load() }
  function esc(s){ return String(s == null ? '' : s).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c] }) }

  // ---------- 登录 ----------
  $('#doLogin').onclick = function(){
    var pw = $('#pw').value;
    $('#loginErr').textContent = '';
    this.disabled = true;
    api('api/login', { method:'POST', body: JSON.stringify({ password: pw }) })
      .then(function(r){
        token = r.token; localStorage.setItem('cs_token', token);
        if (r.waline && r.waline.token) sessionStorage.setItem('TOKEN', r.waline.token);
        showApp();
      })
      .catch(function(e){ $('#loginErr').textContent = e.message })
      .then(function(){ $('#doLogin').disabled = false });
  };
  $('#pw').addEventListener('keydown', function(e){ if (e.key === 'Enter') $('#doLogin').click() });
  $('#logout').onclick = function(){ token=''; localStorage.removeItem('cs_token'); sessionStorage.removeItem('TOKEN'); showLogin() };

  // ---------- 列表 ----------
  function load(){
    return api('api/items/' + tab).then(function(r){
      items = r.items || []; render(); showContent();
    }).catch(function(e){
      if (/未登录|过期/.test(e.message)) showLogin(); else toast(e.message);
    });
  }

  function render(){
    var box = $('#list'); box.innerHTML = '';
    $('#empty').style.display = items.length ? 'none' : 'flex';
    $('#count').textContent = items.length ? '共 ' + items.length + ' 条' : '';

    var cats = {};
    items.forEach(function(it){ if (it.category) cats[it.category] = 1 });
    $('#catList').innerHTML = Object.keys(cats).map(function(c){ return '<option value="'+esc(c)+'">' }).join('');

    items.forEach(function(it){
      var card = document.createElement('div'); card.className = 'card';
      var thumb = it.image
        ? '<img src="' + esc(it.image) + '" alt="" loading="lazy">'
        : esc(it.icon || (tab === 'shares' ? '✨' : '🖼️'));
      var chips = '';
      if (it.category) chips += '<span class="chip cat">' + esc(it.category) + '</span>';
      if (it.date) chips += '<span class="chip">' + esc(it.date) + '</span>';
      if (it.image) chips += '<span class="chip">有图片</span>';

      card.innerHTML =
        '<div class="thumb">' + thumb + '</div>' +
        '<div class="meta"><div class="t">' + esc(it.title) + '</div>' +
        '<div class="d">' + esc(it.desc || '（无描述）') + '</div>' +
        (chips ? '<div class="chips">' + chips + '</div>' : '') + '</div>' +
        '<div class="acts">' +
          '<button class="btn sm ghost icon" data-edit="' + it.id + '" title="编辑">' +
            '<svg class="ico" viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg></button>' +
          '<button class="btn sm danger icon" data-del="' + it.id + '" title="删除">' +
            '<svg class="ico" viewBox="0 0 24 24"><path d="M3 6h18"/><path d="M8 6V4h8v2"/><path d="M19 6l-1 14H6L5 6"/></svg></button>' +
        '</div>';
      box.appendChild(card);
    });
  }

  $('#list').addEventListener('click', function(e){
    var b = e.target.closest('button'); if (!b) return;
    var ed = b.getAttribute('data-edit'), dl = b.getAttribute('data-del');
    if (ed) openEditor(items.filter(function(i){ return i.id === ed })[0]);
    if (dl) {
      if (!confirm('确定删除这条内容？删除后无法恢复。')) return;
      api('api/items/' + tab + '/' + dl, { method:'DELETE' })
        .then(function(){ toast('已删除'); load() }).catch(function(err){ toast(err.message) });
    }
  });

  // ---------- 视图切换 ----------
  function showContent(){
    $('#commentPane').classList.remove('on');
    $('#list').style.display = '';
    $('#addBtn').style.display = '';
    closeEditor();
  }
  document.querySelectorAll('.seg [data-tab]').forEach(function(b){
    b.onclick = function(){
      tab = b.getAttribute('data-tab');
      document.querySelectorAll('.seg [data-tab]').forEach(function(x){ x.classList.toggle('on', x === b) });
      $('#commentTab').classList.remove('on');
      showContent(); load();
    };
  });
  $('#commentTab').onclick = function(){
    document.querySelectorAll('.seg [data-tab]').forEach(function(x){ x.classList.remove('on') });
    $('#commentTab').classList.add('on');
    $('#list').style.display = 'none';
    $('#empty').style.display = 'none';
    $('#addBtn').style.display = 'none';
    closeEditor();
    $('#commentPane').classList.add('on');
    var f = $('#commentFrame');
    if (!f.getAttribute('src')) f.setAttribute('src', '/comment/ui');
  };

  // ---------- 抽屉 ----------
  function openEditor(it){
    editing = it;
    $('#editor').classList.add('on'); $('#scrim').classList.add('on');
    $('#editorTitle').textContent = it ? '编辑' : '新增';
    $('#fieldsPhotos').style.display = tab === 'photos' ? '' : 'none';
    $('#fieldsShares').style.display = tab === 'shares' ? '' : 'none';
    var today = new Date().toISOString().slice(0, 10);
    if (tab === 'photos') {
      $('#p_title').value = it ? it.title : '';
      $('#p_desc').value = it ? (it.desc || '') : '';
      $('#p_date').value = it ? (it.date || '') : today;
      $('#p_icon').value = it ? (it.icon || '🖼️') : '🖼️';
      setPreview(it ? it.image : '');
    } else {
      $('#s_title').value = it ? it.title : '';
      $('#s_category').value = it ? (it.category || '') : '';
      $('#s_date').value = it ? (it.date || '') : today;
      $('#s_desc').value = it ? (it.desc || '') : '';
      $('#s_url').value = it ? (it.url === '#' ? '' : it.url) : '';
    }
    setTimeout(function(){ (tab === 'photos' ? $('#p_title') : $('#s_title')).focus() }, 320);
  }
  function closeEditor(){
    $('#editor').classList.remove('on'); $('#scrim').classList.remove('on'); editing = null;
  }
  $('#addBtn').onclick = function(){ openEditor(null) };
  $('#cancelBtn').onclick = closeEditor;
  $('#cancelBtn2').onclick = closeEditor;
  $('#scrim').onclick = closeEditor;
  document.addEventListener('keydown', function(e){ if (e.key === 'Escape') closeEditor() });

  function setPreview(url){
    var img = $('#p_preview');
    if (url) {
      img.src = url + (url.indexOf('?') < 0 ? '?v=' + Date.now() : '');
      img.style.display = ''; img._path = url;
    } else {
      img.removeAttribute('src'); img.style.display = 'none'; img._path = '';
    }
  }

  // ---------- 图片上传 ----------
  $('#drop').onclick = function(){ $('#p_file').click() };
  $('#p_file').onchange = function(){ if (this.files[0]) upload(this.files[0]) };
  ['dragenter','dragover'].forEach(function(t){ $('#drop').addEventListener(t, function(e){ e.preventDefault(); $('#drop').classList.add('over') }) });
  ['dragleave','drop'].forEach(function(t){ $('#drop').addEventListener(t, function(e){ e.preventDefault(); $('#drop').classList.remove('over') }) });
  $('#drop').addEventListener('drop', function(e){ var f = e.dataTransfer.files[0]; if (f) upload(f) });

  function upload(file){
    if (uploading) return;
    if (!/^image\//.test(file.type)) return toast('请选择图片文件');
    if (file.size > 8 * 1024 * 1024) return toast('图片超过 8MB');
    uploading = true; toast('图片上传中…', 1500);
    var fr = new FileReader();
    fr.onload = function(){
      api('api/upload', { method:'POST', body: JSON.stringify({ filename: file.name, data: fr.result }) })
        .then(function(r){ setPreview(r.url); toast('图片已上传') })
        .catch(function(e){ toast(e.message) })
        .then(function(){ uploading = false });
    };
    fr.readAsDataURL(file);
  }

  // ---------- 保存 ----------
  $('#saveBtn').onclick = function(){
    var body, path = 'api/items/' + tab;
    if (tab === 'photos') {
      body = { title: $('#p_title').value, desc: $('#p_desc').value, date: $('#p_date').value,
               icon: $('#p_icon').value, image: $('#p_preview')._path || '' };
    } else {
      body = { title: $('#s_title').value, category: $('#s_category').value, date: $('#s_date').value,
               desc: $('#s_desc').value, url: $('#s_url').value };
    }
    if (!body.title.trim()) return toast('标题不能为空');
    var method = 'POST';
    if (editing) { method = 'PUT'; path += '/' + editing.id }
    api(path, { method: method, body: JSON.stringify(body) })
      .then(function(){ toast('已保存'); closeEditor(); load() })
      .catch(function(e){ toast(e.message) });
  };

  // ---------- 启动 ----------
  if (token) {
    api('api/items/photos').then(showApp).catch(function(){ token=''; localStorage.removeItem('cs_token'); showLogin() });
  } else showLogin();
})();
</script>
</body>
</html>
